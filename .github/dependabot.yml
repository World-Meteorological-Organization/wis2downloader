# Version-update PRs disabled (limit 0); updates are applied by hand.
# Security-update PRs are a repo setting (Settings > Advanced Security).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directories:
      - /containers
      - /modules/subscription_manager
      - /modules/task_manager
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /containers/backend
      - /containers/docs
      - /containers/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # Upstream images in docker-compose.yaml (valkey, loki, prometheus, grafana)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
