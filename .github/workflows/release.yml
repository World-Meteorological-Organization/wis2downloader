# Release on a version tag (v<__version__>, e.g. v1.0.0b2 or v1.0.1):
# checks, scanned multi-arch images to GHCR, then a GitHub Release with the
# docker-compose.images.yml and the install bundle, then docs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_PREFIX: ghcr.io/world-meteorological-organization
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    # forks can't publish
    if: github.repository == 'World-Meteorological-Organization/wis2downloader'
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Tag must match __version__
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' modules/shared/shared/__init__.py)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ ${version}"
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::${version} is not a release version (X.Y.Z, or X.Y.Z with aN, bN or rcN)"
            exit 1
          fi
          prerelease=false
          [[ "$version" =~ [a-z] ]] && prerelease=true
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

  lint:
    needs: version
    uses: ./.github/workflows/lint.yml

  test:
    needs: version
    uses: ./.github/workflows/test.yml

  security:
    needs: version
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  images:
    name: Publish image (${{ matrix.service }})
    needs: [version, lint, test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      matrix:
        include:
          - service: backend
            context: .
          - service: ui
            context: .

    env:
      IMAGE: wis2downloader-${{ matrix.service }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Scan the amd64 build before anything is pushed; the push below reuses its cached layers
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: containers/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=release-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.service }}

      - name: Fail on fixable high/critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          scanners: vuln,secret
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: containers/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.GHCR_PREFIX }}/${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=release-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.service }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.GHCR_PREFIX }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Save digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          echo "$DIGEST" > "digests/${{ matrix.service }}.digest"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digest-${{ matrix.service }}
          path: digests/

  release:
    name: GitHub Release
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Write images file and bundle
        run: |
          name="wis2downloader-${VERSION}"
          mkdir -p "dist/${name}/config"
          bash .github/scripts/pin-images.sh "$VERSION" "$GHCR_PREFIX" digests > dist/docker-compose.images.yml
          cat dist/docker-compose.images.yml
          cp docker-compose.yaml default.env setup.sh update.sh README.adoc LICENSE CHANGELOG.md \
            dist/docker-compose.images.yml "dist/${name}/"
          cp -r config/grafana config/loki config/prometheus "dist/${name}/config/"
          echo "$VERSION" > "dist/${name}/VERSION"
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          (cd dist && sha256sum "${name}.tar.gz" docker-compose.images.yml > SHA256SUMS)

      - name: Attest release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/docker-compose.images.yml

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "wis2downloader ${VERSION}" --generate-notes --verify-tag)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            "dist/wis2downloader-${VERSION}.tar.gz" dist/docker-compose.images.yml dist/SHA256SUMS

  docs:
    needs: release
    uses: ./.github/workflows/docs.yml
    secrets: inherit
