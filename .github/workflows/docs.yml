# Docs are built on pull requests that touch them and published to GitHub Pages (gh-pages branch)
# by release.yml, or by hand for an existing release (run on its tag).
# Site layout: /<version>/, /latest/ (newest final release) and a root page redirecting to latest/.
name: Docs

on:
  pull_request:
    branches: [main]
    paths: ["docs/**", "containers/docs/**"]
  workflow_call:  # release.yml
    inputs:
      version:
        type: string
        required: true
      latest:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.0b2 (run on its tag)"
        type: string
        required: true
      latest:
        description: "Also publish as latest"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build docs
        run: docker build -f containers/docs/Dockerfile --output site .

      - name: List pages
        run: find site -name "*.html" | sort

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docs-site
          path: site/

  publish:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
      LATEST: ${{ inputs.latest }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docs-site
          path: site

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: gh-pages
          path: pages

      - name: Publish to gh-pages
        working-directory: pages
        run: |
          if [ "$GITHUB_REF_NAME" != "v${VERSION}" ]; then
            echo "::error::Docs for ${VERSION} must be built from tag v${VERSION}, not ${GITHUB_REF_NAME}"
            exit 1
          fi
          targets=("$VERSION")
          [ "$LATEST" = true ] && targets+=(latest)
          for dir in "${targets[@]}"; do
            rm -rf "$dir"
            cp -r ../site "$dir"
          done
          rm -rf ar en es fr ru zh wmo-asciidoc.css  # pre-versioning layout
          # Each index.html's stylesheet loads ../wmo-logo-en.png, i.e. from the site root
          cp ../site/wmo-logo-en.png .
          printf '%s\n' '<!doctype html>' '<meta charset="utf-8">' '<title>WIS2 Downloader documentation</title>' \
            '<meta http-equiv="refresh" content="0; url=latest/">' \
            '<a href="latest/">WIS2 Downloader documentation</a>' > index.html
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Docs ${VERSION} (latest: ${LATEST})"
          git push
